<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fits-js browser-input</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 2rem;
        line-height: 1.5;
      }
      pre {
        background: #f5f5f5;
        padding: 1rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>fits-js browser-input</h1>
    <p>Pick a FITS file to enumerate HDUs and read a small cutout from the first 2D image.</p>
    <input id="file" type="file" accept=".fits,.fit,.fts,image/fits" />
    <pre id="out">No file selected.</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
