version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # managed via pnpm catalog in pnpm-workspace.yaml
      - dependency-name: typescript
      - dependency-name: eslint
      - dependency-name: prettier
      # pinned to the lowest apache-arrow the @fits-js/arrow peer range admits
      - dependency-name: apache-arrow-17
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
